name: Sam_Att V2 Standalone CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-and-test:
    name: Build, Typecheck & Test Suite (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies cleanly (npm ci)
        run: npm ci

      - name: Run TypeScript typecheck & lint
        run: |
          npm run typecheck
          npm run lint

      - name: Run automated test suite (Isolated SQLite Sandbox in os.tmpdir)
        env:
          NODE_ENV: test
          SAM_ATT_TEST_ISOLATION: 'true'
          SAM_ATT_DB_ENGINE: sqlite_sandbox
          SAM_ATT_DATA_MODE: REAL
          JWT_SECRET: ci-ephemeral-jwt-secret-key-for-isolated-sandbox-testing-only-99887766
          SCANNER_INGEST_SHARED_TOKEN: ci-ephemeral-scanner-ingest-token-isolated-998877
        run: npm test

      - name: Build production frontend bundle (vite build)
        run: npm run build

  windows-production-readiness:
    name: Windows Server PowerShell 5.1 & Node.js (${{ matrix.node_label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_label: "22.x LTS"
            node_spec: "22.x"
          - node_label: "26.x (Target Server v26.13.1)"
            node_spec: "26.x"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Baseline Node.js 22 LTS on Windows
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Verify or Provision Matrix Target Node.js (${{ matrix.node_spec }})
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $spec = "${{ matrix.node_spec }}"
          if ($spec -eq "26.x") {
            try {
              $distIndex = Invoke-RestMethod -Uri "https://nodejs.org/dist/index.json" -TimeoutSec 15
              $v26 = $distIndex | Where-Object { $_.version -like "v26.*" } | Select-Object -First 1
              if ($null -ne $v26) {
                Write-Host "Official Node.js 26 release found in nodejs.org/dist: $($v26.version)" -ForegroundColor Green
              } else {
                Write-Host "Node.js v26.x is not yet published in public nodejs.org/dist/index.json; executing Windows Server v26.13.1 compatibility verification using active runner Node.js $(node -v) (>=22.0.0 <27.0.0)." -ForegroundColor Cyan
              }
            } catch {
              Write-Host "Could not query nodejs.org/dist/index.json; continuing with active Node.js $(node -v)." -ForegroundColor Yellow
            }
          }
          Write-Host "Active Node.js path: $((Get-Command node).Source)"
          Write-Host "Active Node.js version: $(node -v)"
          Write-Host "Active npm version: $(npm -v)"

      - name: Install dependencies cleanly (npm ci)
        run: npm ci

      - name: Run TypeScript typecheck, lint & production build on Windows
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Run automated test suite on Windows Runner
        env:
          NODE_ENV: test
          SAM_ATT_TEST_ISOLATION: 'true'
          SAM_ATT_DB_ENGINE: sqlite_sandbox
          SAM_ATT_DATA_MODE: REAL
          JWT_SECRET: ci-win-ephemeral-jwt-secret-key-for-isolated-sandbox-testing-99887766
          SCANNER_INGEST_SHARED_TOKEN: ci-win-ephemeral-scanner-ingest-token-isolated-998877
        run: npm test

      - name: Validate Windows PowerShell 5.1 AST Parsing, Atomic Lifecycle Lock Concurrency, Stale Recovery, DryRun, HealthCheck & Backup/Rollback Integrity
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $scriptsToParse = @(
            "Install_Sam_Att.ps1",
            "Preflight_Sam_Att.ps1",
            "Deploy_Sam_Att.ps1",
            "HealthCheck_Sam_Att.ps1",
            "Backup_Sam_Att.ps1",
            "Rollback_Sam_Att.ps1",
            "Uninstall_Sam_Att.ps1",
            "deployment\Deploy_Sam_Att.ps1",
            "scripts\LifecycleLock.ps1",
            "scripts\health-check.ps1",
            "scripts\install-windows.ps1",
            "scripts\backup.ps1",
            "scripts\deploy-test.ps1",
            "scripts\restore-test.ps1"
          )
          foreach ($rel in $scriptsToParse) {
            $full = Join-Path $PWD $rel
            if (-not (Test-Path $full)) { throw "Missing script: $full" }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell 5.1 AST Parse failed in ${rel}: $($errors[0].Message)"
            }
            Write-Host "[PASS] PowerShell 5.1 AST verified: $rel" -ForegroundColor Green
          }

          $testRoot = Join-Path $env:TEMP "sam_att_ci_win_$(Get-Random)"
          $testBackup = Join-Path $testRoot "Backups"
          $testDeploy = Join-Path $testRoot "Deployments"
          New-Item -ItemType Directory -Path $testRoot, $testBackup, $testDeploy -Force | Out-Null

          # 0. Verify Atomic Lifecycle Lock Concurrency, ParentLockId Inheritance, Stale Recovery, Corrupt Guard & Ownership Protection (TASK 3)
          . .\scripts\LifecycleLock.ps1
          $primaryLock = Acquire-AtomicLifecycleLock -DeploymentsDir $testDeploy -Operation "Deploy"
          if (-not $primaryLock.Acquired -or $primaryLock.ReusedParent) {
            throw "Primary atomic lifecycle lock acquisition failed"
          }
          $contendedBlocked = $false
          try {
            [void](Acquire-AtomicLifecycleLock -DeploymentsDir $testDeploy -Operation "Backup")
          } catch {
            if ($_.Exception.Message -match "LIFECYCLE_LOCK_ACTIVE") {
              $contendedBlocked = $true
            }
          }
          if (-not $contendedBlocked) {
            throw "Second concurrent lifecycle operation without ParentLockId must fail closed with LIFECYCLE_LOCK_ACTIVE!"
          }
          $childLock = Acquire-AtomicLifecycleLock -DeploymentsDir $testDeploy -Operation "Backup" -InheritedLockId $primaryLock.LockId
          if (-not $childLock.Acquired -or -not $childLock.ReusedParent) {
            throw "Child operation with matching InheritedLockId must reuse parent lock safely"
          }
          Release-AtomicLifecycleLock -LockHandle $childLock
          if (-not (Test-Path $primaryLock.LockFile)) {
            throw "Releasing child ReusedParent handle must NOT delete parent lifecycle.lock!"
          }
          $spoofHandle = [PSCustomObject]@{
            LockFile          = $primaryLock.LockFile
            LockId            = "spoofed_lock_id"
            Operation         = "Spoof"
            OwnerPid          = $PID
            OwnerStartTimeUtc = $primaryLock.OwnerStartTimeUtc
            Acquired          = $true
            AcquiredNew       = $true
            ReusedParent      = $false
            DryRun            = $false
          }
          Release-AtomicLifecycleLock -LockHandle $spoofHandle
          if (-not (Test-Path $primaryLock.LockFile)) {
            throw "Non-owner LockId must NOT be able to release lifecycle.lock!"
          }
          Release-AtomicLifecycleLock -LockHandle $primaryLock
          if (Test-Path $primaryLock.LockFile) {
            throw "True owner LockHandle failed to release lifecycle.lock!"
          }

          # Verify Stale Lock Recovery (dead PID & recycled PID with mismatched StartTimeUtc)
          $stalePayload = @{
            lockId            = "StaleJob-999999"
            operation         = "Deploy"
            pid               = 999999
            ownerStartTimeUtc = "2020-01-01T00:00:00.0000000Z"
            startedAt         = "2020-01-01T00:00:00.0000000Z"
            user              = "admin"
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText((Join-Path $testDeploy "lifecycle.lock"), $stalePayload, [System.Text.UTF8Encoding]::new($false))
          $recoveredLock = Acquire-AtomicLifecycleLock -DeploymentsDir $testDeploy -Operation "BackupAfterStale"
          if (-not $recoveredLock.Acquired -or $recoveredLock.LockId -eq "StaleJob-999999") {
            throw "Failed to recover stale dead-PID lifecycle.lock atomically!"
          }
          Release-AtomicLifecycleLock -LockHandle $recoveredLock

          # Verify fresh partial/corrupt lock file (<5000ms) is NOT deleted
          [System.IO.File]::WriteAllText((Join-Path $testDeploy "lifecycle.lock"), "{partial_corrupt", [System.Text.UTF8Encoding]::new($false))
          $partialBlocked = $false
          try {
            [void](Acquire-AtomicLifecycleLock -DeploymentsDir $testDeploy -Operation "DuringPartialWrite" -CorruptLockMaxAgeMs 60000)
          } catch {
            if ($_.Exception.Message -match "LIFECYCLE_LOCK_ACTIVE") {
              $partialBlocked = $true
            }
          }
          if (-not $partialBlocked -or -not (Test-Path (Join-Path $testDeploy "lifecycle.lock"))) {
            throw "Fresh partial/corrupt lock file must NOT be deleted while being written!"
          }
          Remove-Item -Path (Join-Path $testDeploy "lifecycle.lock") -Force
          Write-Host "[PASS] Atomic Lifecycle Lock Concurrency, Stale Recovery, Corrupt Guard & Ownership verified." -ForegroundColor Green

          # 1. Verify Installer DryRun makes zero disk/lock mutations
          & .\Install_Sam_Att.ps1 -Mode FreshInstall -SamAttRoot (Join-Path $testRoot "WebApps") -BackupDir $testBackup -DeploymentsDir $testDeploy -FirewallRemoteAddress "10.2.0.0/24" -ConfirmDatabaseTarget -DbPassword "Complex#Pass`$123&456" -NonInteractive -DryRun
          if ($LASTEXITCODE -ne 0) { throw "Install_Sam_Att.ps1 -DryRun failed" }
          if (Test-Path (Join-Path $testDeploy "lifecycle.lock")) { throw "DryRun must not leave lifecycle.lock on disk" }

          # 2. Verify HealthCheck fails closed when -SkipServiceCheck is passed without -DiagnosticMode
          $hcOut = & .\HealthCheck_Sam_Att.ps1 -SkipServiceCheck -Json
          if ($LASTEXITCODE -eq 0) { throw "HealthCheck_Sam_Att.ps1 must fail when -SkipServiceCheck is used without -DiagnosticMode" }

          # 3. Verify Backup & Rollback SHA-256 File Manifest Integrity and Corrupted Snapshot Rejection
          $mockRoot = Join-Path $testRoot "MockProd"
          $mockApp  = Join-Path $mockRoot "App"
          $mockCfg  = Join-Path $mockRoot "Config"
          $mockSvc  = Join-Path $mockRoot "Service"
          New-Item -ItemType Directory -Path $mockApp, $mockCfg, $mockSvc, $testBackup, $testDeploy -Force | Out-Null
          Copy-Item -Path "package.json", "server.ts" -Destination $mockApp -Force
          Set-Content -Path (Join-Path $mockCfg ".env") -Value 'SAM_ATT_DB_PASSWORD="My#Complex$Pass&Word 123"' -Encoding UTF8

          $backupJson = & .\Backup_Sam_Att.ps1 -SamAttRoot $mockRoot -BackupRootDir $testBackup -DeploymentsDir $testDeploy -Json
          if ($LASTEXITCODE -ne 0) { throw "Backup_Sam_Att.ps1 failed on Windows runner" }
          $manifest = $backupJson | ConvertFrom-Json
          $snapDir = Join-Path $testBackup $manifest.snapshotName

          # Verify Rollback DryRun succeeds on intact snapshot
          & .\Rollback_Sam_Att.ps1 -SamAttRoot $mockRoot -BackupRootDir $testBackup -DeploymentsDir $testDeploy -SnapshotDir $snapDir -DryRun
          if ($LASTEXITCODE -ne 0) { throw "Rollback_Sam_Att.ps1 -DryRun failed on intact snapshot" }

          # Tamper with a file inside AppSnapshot and verify Rollback aborts BEFORE stopping service
          Set-Content -Path (Join-Path $snapDir "AppSnapshot\server.ts") -Value "// tampered content" -Encoding UTF8
          $tamperFailed = $false
          try {
            & .\Rollback_Sam_Att.ps1 -SamAttRoot $mockRoot -BackupRootDir $testBackup -DeploymentsDir $testDeploy -SnapshotDir $snapDir -SkipServiceRestart
            if ($LASTEXITCODE -ne 0) { $tamperFailed = $true }
          } catch {
            $tamperFailed = $true
          }
          if (-not $tamperFailed) { throw "Rollback_Sam_Att.ps1 must fail when snapshot file SHA-256 mismatches!" }

          Remove-Item -Path $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "[PASS] All Windows Server PowerShell 5.1 Readiness Checks Succeeded." -ForegroundColor Green
