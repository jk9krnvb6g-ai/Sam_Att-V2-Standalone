name: Sam_Att V2 Standalone CI

on:
  push:
    branches: [ main, develop, 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Security Gate — Verify Zero Committed Private Keys, SQLite Databases, or Conflicting Lockfiles
        run: |
          if [ -f "certs/server.key" ] || [ -f "data/sam_att_v2.sqlite" ] || [ -f "bun.lock" ]; then
            echo "SECURITY VIOLATION: Private keys, SQLite runtime files, or conflicting lockfiles must not be committed!"
            exit 1
          fi

      - name: Setup Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Clean Install Locked Dependencies (npm ci)
        run: npm ci

      - name: TypeScript Strict Verification
        run: npm run typecheck

      - name: Build Production Frontend Bundle
        run: npm run build

      - name: Run Database Migrations & Full Integration Test Matrix
        run: npm test
